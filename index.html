<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <!-- Resolve the theme before first paint (no light flash in dark mode); mirrors settingsStore.getResolvedTheme() -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('mkdn-settings') || '{}').theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' ipc: ipc://localhost http://ipc.localhost; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ipc: ipc://localhost http://ipc.localhost ws://localhost:* http://localhost:*; img-src 'self' data: blob: https:; worker-src 'self' blob:;" />
  <meta name="theme-color" content="#2563eb" />
  <title>MKDN — Browser-based Markdown Editor</title>
  <meta name="description" content="A minimal, distraction-free WYSIWYG markdown editor. Opens and saves real files, works offline, keeps version history." />
  <link rel="canonical" href="https://nkarasiak.github.io/mkdn/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nkarasiak.github.io/mkdn/" />
  <meta property="og:title" content="MKDN — Browser-based Markdown Editor" />
  <meta property="og:description" content="A minimal, distraction-free WYSIWYG markdown editor. Opens and saves real files, works offline, keeps version history." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MKDN — Browser-based Markdown Editor" />
  <meta name="twitter:description" content="A minimal, distraction-free WYSIWYG markdown editor. Opens and saves real files, works offline, keeps version history." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking: first paint never waits on (or, offline, times out on) Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
